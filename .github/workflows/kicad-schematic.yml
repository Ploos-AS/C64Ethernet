name: KiCad schematic validation

on:
  push:
    paths:
      - 'hardware/kicad/**'
      - 'tools/ci/**'
      - '.github/workflows/kicad-schematic.yml'
  pull_request:
    paths:
      - 'hardware/kicad/**'
      - 'tools/ci/**'
      - '.github/workflows/kicad-schematic.yml'

jobs:
  kicad-schematic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install KiCad 7 and headless GUI helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y kicad xvfb xdotool
          echo "Migration KiCad version: $(kicad-cli version)"
          kicad-cli version | grep -E '^7\.'
          chmod +x tools/ci/migrate_kicad_legacy.sh

      - name: Migrate legacy schematic with KiCad 7
        run: tools/ci/migrate_kicad_legacy.sh

      - name: Verify native schematic produced
        run: |
          test -s hardware/kicad/C64Ethernet.kicad_sch
          grep -q '(kicad_sch' hardware/kicad/C64Ethernet.kicad_sch
          grep -q '(symbol ' hardware/kicad/C64Ethernet.kicad_sch

      - name: Upgrade to KiCad 9 for ERC
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
          echo "ERC KiCad version: $(kicad-cli version)"
          kicad-cli version | grep -E '^9\.'

      - name: Run KiCad ERC with KiCad 9
        run: |
          mkdir -p build/kicad
          kicad-cli sch erc \
            --exit-code-violations \
            --severity-all \
            --output build/kicad/C64Ethernet-erc.rpt \
            hardware/kicad/C64Ethernet.kicad_sch

      - name: Upload migrated schematic and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c64ethernet-kicad-validation
          path: |
            hardware/kicad/C64Ethernet.kicad_sch
            build/kicad/
          if-no-files-found: ignore
